server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/html text/css application/javascript;

    location = / {
        return 302 /documentation/;
    }

    location = /documentation {
        return 301 /documentation/;
    }

    location /documentation/ {
        try_files $uri $uri/ /documentation/index.html;
    }
}
