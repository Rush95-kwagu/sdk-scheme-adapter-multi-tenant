# WAF (41.214.65.90) — documentation publique SDK multi-tenant
# DNS A : docs.ext.openmfi.org → 41.214.65.90
# VM    : sdk-mt-docs déjà sur 172.25.2.117:80
# URL   : https://docs.ext.openmfi.org/documentation
#
# 1. Ajouter docs.ext.openmfi.org au server_name du bloc listen 80 (return 301 https).
# 2. Coller ce server { } dans le même fichier nginx que les vhosts DFSP.
# 3. nginx -t && systemctl reload nginx
#
# Ne pas mettre /documentation dans les vhosts gto / moov-test / etc.

server {
    listen 443 ssl;
    http2 on;
    server_name docs.ext.openmfi.org;

    ssl_certificate     /etc/letsencrypt/live/openmfi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmfi.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location = / {
        return 302 /documentation/;
    }

    location / {
        proxy_pass http://172.25.2.117:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
