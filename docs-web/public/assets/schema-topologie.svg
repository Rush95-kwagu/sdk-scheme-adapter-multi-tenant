  <text x="460" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">MCM, Hydra, PXC,</text>
  <text x="460" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">ALS, quoting, transfers</text>

  <rect x="612" y="396" width="240" height="160" rx="8" fill="#eee9f8" stroke="#5c4a9a" stroke-width="1.6"/>
