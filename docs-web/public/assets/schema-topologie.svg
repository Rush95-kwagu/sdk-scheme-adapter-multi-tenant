  <text x="188" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d4e8c">Control Center</text>
  <text x="188" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">Harbor, MinIO,</text>
