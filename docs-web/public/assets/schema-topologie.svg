  <text x="732" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c4a9a">SDK DFSP | Docker</text>
  <text x="732" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">sdk-scheme-adapter,</text>
  <text x="732" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">mcm-agent, Vault</text>
  <text x="732" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c5854">172.25.2.117</text>
