# Overlay SDK + vrais mcm-agents (pas poc/).
# Réseaux tenants : générés (just build → lab/compose.tenants.yml).
#
#   just build
#   # ou : bash lab/discover-tenants.sh && docker compose -f lab/docker-compose.yml \
#   #          -f lab/compose.tenants.yml --env-file lab/.env --env-file lab/.env.tenants up --build -d

name: sdk-fececam

services:
  redis:
    image: redis:7-alpine
    networks:
      - overlay

  sdk:
    container_name: sdk-fececam
    image: sdk-scheme-adapter-multi-dfsp:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - redis
    env_file:
      - .env
      - .env.tenants
    ports:
      - "${IN:-11000}:5000"
      - "${OUT:-11001}:5001"
      - "127.0.0.1:${MET:-11040}:5040"
    extra_hosts:
      - "extapi.openmfi.org:172.16.2.28"
    environment:
      LOG_LEVEL: info
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PM4ML_ENABLED: "true"
      PM4ML_MULTI_TENANT: "true"
      DFSP_HOST_SUFFIX: ".ext.openmfi.org"
      OUTBOUND_COMPACT_RESPONSE: "${OUTBOUND_COMPACT_RESPONSE:-true}"
      OUTBOUND_API_KEY_ENABLED: "${OUTBOUND_API_KEY_ENABLED:-false}"
      OUTBOUND_API_KEY: "${OUTBOUND_API_KEY:-}"
      MGMT_API_WS_URLS: "${MGMT_API_WS_URLS:?run just build (discover mcm-agent-*)}"
      DFSP_ID: placeholder
      CACHE_URL: redis://redis:6379
      PEER_ENDPOINT: extapi.openmfi.org
      ALS_ENDPOINT: extapi.openmfi.org
      QUOTES_ENDPOINT: extapi.openmfi.org
      TRANSFERS_ENDPOINT: extapi.openmfi.org
      TRANSACTION_REQUESTS_ENDPOINT: extapi.openmfi.org
      BULK_QUOTES_ENDPOINT: extapi.openmfi.org
      BULK_TRANSFERS_ENDPOINT: extapi.openmfi.org
      BACKEND_ENDPOINT: 172.16.2.16:8100/mojaloop
      INBOUND_LISTEN_PORT: "5000"
      OUTBOUND_LISTEN_PORT: "5001"
      METRICS_SERVER_LISTEN_PORT: "5040"
      INBOUND_MUTUAL_TLS_ENABLED: "false"
      OUTBOUND_MUTUAL_TLS_ENABLED: "true"
      JWS_SIGN: "false"
      VALIDATE_INBOUND_JWS: "false"
      ENABLE_BACKEND_EVENT_HANDLER: "false"
      ENABLE_FSPIOP_EVENT_HANDLER: "false"
      API_TYPE: fspiop
      ILP_VERSION: "4"
      CHECK_ILP: "false"
      AUTO_ACCEPT_PARTY: "true"
      AUTO_ACCEPT_QUOTES: "true"
      RESOURCE_VERSIONS: transfers=2.0,quotes=2.0,participants=2.0,parties=2.0,transactionRequests=1.1
    networks:
      - overlay

networks:
  overlay:
    name: sdk-fececam
